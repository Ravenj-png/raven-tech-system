<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SchoolHub | Complete System</title>
  <style>
    /* =========================================
       BASE & RESET
       ========================================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    }

    body {
      background: #f4f7fc;
      padding: 24px;
      line-height: 1.5;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    .container {
      max-width: 1450px;
      margin: 0 auto;
    }

    /* =========================================
       CARDS & TYPOGRAPHY
       ========================================= */
    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      border: 1px solid #e5e7eb;
      position: relative;
    }

    .login-box {
      max-width: 480px;
      margin: 60px auto;
    }

    h1 {
      color: #1e40af;      text-align: center;
      margin-bottom: 28px;
      font-size: 32px;
      font-weight: 700;
    }

    h2 {
      color: #1e40af;
      margin-bottom: 22px;
      font-size: 24px;
      border-bottom: 3px solid #3b82f6;
      padding-bottom: 10px;
    }

    h3 {
      color: #1e40af;
      margin: 20px 0 14px 0;
      font-size: 20px;
      font-weight: 600;
    }

    h4 {
      color: #374151;
      margin: 14px 0 10px 0;
      font-size: 16px;
      font-weight: 600;
    }

    /* =========================================
       FORMS & INPUTS
       ========================================= */
    input, select, textarea {
      width: 100%;
      padding: 13px 15px;
      margin: 9px 0;
      border: 2px solid #d1d5db;
      border-radius: 12px;
      font-size: 15px;
      background: #f9fafb;
      transition: 0.2s;
      -webkit-appearance: none;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      background: #fff;
    }
    textarea {
      resize: vertical;
      min-height: 90px;
    }

    /* =========================================
       BUTTONS
       ========================================= */
    button {
      padding: 11px 18px;
      margin: 6px;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: 0.2s;
      -webkit-tap-highlight-color: transparent;
      min-height: 44px;
      type: button;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.12);
    }

    button:active {
      transform: translateY(0);
    }

    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-danger  { background: #ef4444; color: #fff; }
    .btn-success { background: #10b981; color: #fff; }
    .btn-warning { background: #f59e0b; color: #fff; }
    .btn-info    { background: #06b6d4; color: #fff; }
    .btn-secondary { background: #64748b; color: #fff; }

    /* =========================================
       FILTERS & TABLES
       ========================================= */
    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 20px 0;
      overflow-x: auto;
      padding-bottom: 8px;
    }
    .filter-chip {
      padding: 9px 18px;
      background: #f1f5f9;
      border-radius: 30px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      border: 2px solid #e2e8f0;
      white-space: nowrap;
      transition: 0.2s;
    }

    .filter-chip.active {
      background: #3b82f6;
      color: #fff;
      border-color: #3b82f6;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      border-radius: 16px;
      margin: 18px 0;
      background: #fff;
      border: 1px solid #e5e7eb;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 950px;
    }

    th, td {
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid #f3f4f6;
    }

    th {
      background: #f8fafc;
      color: #1e40af;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    tr:hover td {
      background: #fafbfc;
    }

    .actions-cell {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-start;
      min-width: 340px;
    }

    .actions-cell button {
      padding: 7px 12px;
      font-size: 12px;
      margin: 2px;
      white-space: nowrap;
      min-height: 36px;
    }

    /* =========================================
       BADGES & GRADING COLORS
       ========================================= */
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 16px;
      font-size: 11px;
      font-weight: 600;
      margin: 2px;
    }

    .badge-success { background: #d1fae5; color: #065f46; }
    .badge-warning { background: #fed7aa; color: #9a3412; }

    .pts-1 { background: #dcfce7; color: #166534; }
    .pts-2 { background: #d1fae5; color: #065f46; }
    .pts-3 { background: #fef9c3; color: #854d0e; }
    .pts-4 { background: #fed7aa; color: #9a3412; }
    .pts-5 { background: #fecaca; color: #991b1b; }
    .pts-6 { background: #f3f4f6; color: #374151; }

    .sub-1 { background: #dbeafe; color: #1e40af; border: 1px solid #93c5fd; }
    .sub-0 { background: #f9fafb; color: #6b7280; border: 1px solid #d1d5db; }

    /* =========================================
       LAYOUT & COMPONENTS
       ========================================= */
    .profile-card {
      background: linear-gradient(135deg, #f8fafc, #eff6ff);      padding: 22px;
      border-radius: 16px;
      margin-bottom: 20px;
      border-left: 5px solid #3b82f6;
      border: 1px solid #e5e7eb;
    }

    .alert-card {
      background: #fef2f2;
      border-left: 4px solid #ef4444;
      padding: 14px;
      border-radius: 12px;
      margin: 10px 0;
    }

    .result-card {
      background: #f9fafb;
      padding: 18px;
      border-radius: 14px;
      margin: 14px 0;
      border: 1px solid #e5e7eb;
    }

    .marks-table {
      width: 100%;
      margin: 12px 0;
      display: block;
      overflow-x: auto;
      font-size: 12px;
    }

    .marks-table th, .marks-table td {
      padding: 9px 6px;
      text-align: center;
      white-space: nowrap;
    }

    .flex { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    .text-center { text-align: center; }
    .error { color: #ef4444; margin-top: 6px; font-size: 13px; }
    hr { margin: 20px 0; border-color: #e5e7eb; }

    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.55); display: flex; align-items: center;
      justify-content: center; z-index: 9999; padding: 12px;
    }

    .modal-content {      background: #fff; padding: 24px; border-radius: 20px;
      max-width: 900px; width: 100%; max-height: 88vh;
      overflow-y: auto; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    img { border-radius: 50%; object-fit: cover; border: 2px solid #fff; }
    .report-card { background: #f9fafb; padding: 14px; border-radius: 12px; margin: 8px; display: inline-block; min-width: 170px; border: 1px solid #e5e7eb; text-align: center; }
    .announce-card { background: #f9fafb; padding: 14px; border-radius: 12px; margin: 10px 0; border: 1px solid #e5e7eb; border-left: 4px solid #06b6d4; }

    /* =========================================
       SUBJECT GRID
       ========================================= */
    .subject-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 8px;
      max-height: 350px;
      overflow-y: auto;
      background: #f9fafb;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      padding: 16px;
      margin: 10px 0;
    }

    .subject-item {
      display: flex; align-items: center; gap: 8px;
      padding: 10px; background: #fff; border: 2px solid #e5e7eb;
      border-radius: 10px; cursor: pointer; transition: 0.15s; font-size: 12px;
    }

    .subject-item:hover { border-color: #3b82f6; background: #f0f9ff; }
    .subject-item.selected { background: #dbeafe; border-color: #3b82f6; }
    .subject-item input[type="checkbox"] { width: 16px; height: 16px; accent-color: #3b82f6; }

    /* =========================================
       GRAPH
       ========================================= */
    .graph-container {
      background: #fff; padding: 18px; border-radius: 16px;
      border: 1px solid #e5e7eb; margin: 14px 0;
    }

    .graph-legend {
      display: flex; gap: 16px; justify-content: center;
      margin-top: 12px; flex-wrap: wrap;
    }

    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; }
    .legend-color { width: 20px; height: 3px; border-radius: 2px; }
    /* =========================================
       MOBILE & PRINT
       ========================================= */
    @media (max-width: 768px) {
      body { padding: 12px; }
      .card { padding: 18px; margin-bottom: 16px; }
      .login-box { margin: 24px auto; }
      h1 { font-size: 26px; } h2 { font-size: 20px; } h3 { font-size: 18px; }
      button { padding: 9px 14px; font-size: 13px; margin: 4px; }
      .modal-content { padding: 16px; border-radius: 16px; }
      table { font-size: 12px; } th, td { padding: 10px 8px; }
      .subject-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); padding: 12px; }
      .actions-cell button { padding: 6px 10px; font-size: 11px; }
    }

    @media print {
      body { background: #fff !important; padding: 0 !important; }
      .no-print, button, .wa-badge, .filters, .table-wrapper { display: none !important; }
      .modal, .card { box-shadow: none !important; border: 1px solid #ccc !important; background: #fff !important; padding: 16px !important; }
      .result-card, .report-card { border: 1px solid #bbb !important; break-inside: avoid; }
      -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important;
    }

    /* =========================================
       FEATURES
       ========================================= */
    .wa-badge {
      position: absolute; top: 18px; right: 18px;
      width: 46px; height: 46px; border-radius: 50%;
      background: #25D366; color: #fff; display: flex;
      align-items: center; justify-content: center; font-size: 18px;
      cursor: pointer; box-shadow: 0 3px 8px rgba(0,0,0,0.15);
      z-index: 20; text-decoration: none;
    }
    .wa-badge:hover { transform: scale(1.05); }

    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #111827; color: #fff; padding: 12px 20px; border-radius: 24px;
      font-size: 14px; z-index: 99999; box-shadow: 0 6px 14px rgba(0,0,0,0.2);
      animation: toastIn 0.2s ease-out, toastOut 0.2s ease-in 2.6s forwards; pointer-events: none;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(14px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(14px); } }
  </style>
</head>
<body>
  <div class="container" id="app"></div>
  <script>
    (function() {
      // =========================================
      // DATA & CONFIG
      // =========================================
      var API_URL = 'http://localhost:5000/api';
      var students = [], teachers = [], classTeachers = [], announcements = [];
      var currentUser = null;
      var currentFilter = "all";
      var nextStudentId = 1001, nextTeacherId = 2001, nextCTId = 3001;
      var currentPeriod = { year: new Date().getFullYear(), term: 1, phase: 'Beginning' };

      var curriculum = {
        oLevel: ['English Language', 'Literature in English', 'Mathematics', 'Physics', 'Chemistry', 'Biology', 'Agriculture', 'Geography', 'History', 'CRE', 'IRE', 'French', 'German', 'Luganda', 'Swahili', 'Art & Design', 'Music', 'Physical Education', 'Computer Studies', 'Entrepreneurship', 'Food & Nutrition'],
        aLevelPrincipals: ['General Paper', 'Mathematics (Pure)', 'Divinity', 'Sub-Mathematics', 'Physics', 'Chemistry', 'Biology', 'Geography', 'History', 'Economics','Literature', 'Entrepreneurship', 'CRE', 'IRE', 'Literature in English', 'French', 'ICT', 'Art & Design'],
        aLevelSubsidiaries: ['General Paper (Sub)', 'ICT', 'Sub-Mathematics']
      };

      var predefinedCombos = {
        'PCM': ['Physics', 'Chemistry', 'Mathematics (Pure)'],
        'PCB': ['Physics', 'Chemistry', 'Biology'],
        'HEAD':['History', 'Entrepreneurship', 'Art', 'Divinity'],
        'MEG': ['Mathematics (Pure)', 'Economics', 'Geography'],
        'HEG': ['History', 'Economics', 'Geography'],
        'MEL': ['Mathematics (Pure)', 'Economics', 'Literature in English'],
        'PEG': ['Physics', 'Economics', 'Geography'],
        'BCM': ['Biology', 'Chemistry', 'Mathematics (Pure)'],
        'MCE': ['Mathematics (Pure)', 'Chemistry', 'Economics']
      };
      var customCombos = {};

      // =========================================
      // UTILITIES & GRADING
      // =========================================
      window.escapeHtml = function(str) {
        if (!str) return '';
        var d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
      };

      window.showToast = function(msg, type) {
        type = type || 'info';
        var t = document.createElement('div');
        t.className = 'toast';
        t.style.background = type === 'error' ? '#ef4444' : '#111827';
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 2600);
      };
      window.getUCEPoints = function(m) {
        m = parseInt(m) || 0;
        if (m >= 80) return { pts: 1, grade: 'A', class: 'pts-1' };
        if (m >= 70) return { pts: 2, grade: 'B', class: 'pts-2' };
        if (m >= 60) return { pts: 3, grade: 'C', class: 'pts-3' };
        if (m >= 50) return { pts: 4, grade: 'D', class: 'pts-4' };
        if (m >= 40) return { pts: 5, grade: 'E', class: 'pts-5' };
        return { pts: 6, grade: 'F', class: 'pts-6' };
      };

      window.getUACEPoints = function(m) {
        m = parseInt(m) || 0;
        if (m >= 80) return { pts: 6, grade: 'A', class: 'pts-1' };
        if (m >= 70) return { pts: 5, grade: 'B', class: 'pts-2' };
        if (m >= 60) return { pts: 4, grade: 'C', class: 'pts-3' };
        if (m >= 50) return { pts: 3, grade: 'D', class: 'pts-4' };
        if (m >= 45) return { pts: 2, grade: 'E', class: 'pts-5' };
        return { pts: 0, grade: 'F', class: 'pts-6' };
      };

      window.getSubjectPoints = function(subject, marks) {
        marks = parseInt(marks) || 0;
        var isSub = false;
        for (var i = 0; i < curriculum.aLevelSubsidiaries.length; i++) {
          if (curriculum.aLevelSubsidiaries[i] === subject) { isSub = true; break; }
        }
        if (!isSub) return window.getUCEPoints(marks);
        return marks >= 60 ? { pts: 1, grade: 'Pass', class: 'sub-1' } : { pts: 0, grade: 'Fail', class: 'sub-0' };
      };

      window.getStudentSubjects = function(s) {
        if (!s || !s.class) return [];
        if (s.class === 'Senior 5' || s.class === 'Senior 6') {
          var pr = [];
          if (predefinedCombos[s.combination]) pr = predefinedCombos[s.combination].slice();
          else if (customCombos[s.combination]) pr = customCombos[s.combination].slice();
          else pr = ['Principal 1', 'Principal 2', 'Principal 3'];
          return pr.concat(s.subsidiaries || []);
        }
        return s.subjects || curriculum.oLevel.slice();
      };

      window.calculateSubsidiaries = function(principals) {
        var hasEcon = false, hasMath = false;
        for (var i = 0; i < principals.length; i++) {
          var p = principals[i].toLowerCase();
          if (p.indexOf('econ') > -1) hasEcon = true;
          if (p.indexOf('math') > -1) hasMath = true;
        }        if (hasEcon && hasMath) return ['General Paper (Sub)', 'ICT'];
        if (hasEcon && !hasMath) return ['General Paper (Sub)', 'Sub-Mathematics'];
        return ['General Paper (Sub)', 'ICT'];
      };

      // ASCII Report Generator
      window.generateASCIIReport = function(student, result) {
        var s = student, r = result; var lines = [];
        var pad = function(str, len, ch) { ch = ch || ' '; str = str + ''; while (str.length < len) str = ch + str; return str; };
        var center = function(str, len) { str = str + ''; var padLen = Math.floor((len - str.length) / 2); return Array(padLen + 1).join(' ') + str; };
        var border = '═'.repeat(75), subBorder = '─'.repeat(75);
        lines.push(border); lines.push(center('RAVEN SYSTEMS', 75)); lines.push(center('STUDENT ACADEMIC REPORT', 75)); lines.push(border); lines.push('');
        lines.push('STUDENT INFORMATION'); lines.push(subBorder);
        lines.push('Full Name:        ' + (s.name || '')); lines.push('Student ID:       STU-' + String(s.id || '').padStart(6, '0'));
        lines.push('Class:            ' + (s.class || '') + (s.combination ? ' (' + s.combination + ')' : ''));
        lines.push('Phone:            ' + (s.phone || 'N/A')); lines.push('Admission Date:   ' + (s.joinDate || 'N/A')); lines.push('');
        lines.push('TERM INFORMATION'); lines.push(subBorder);
        lines.push('Term:             Term ' + (r ? r.term : currentPeriod.term)); lines.push('Year:             ' + (r ? r.year : currentPeriod.year));
        lines.push('Exam Type:        End of Term'); lines.push('Report Generated: ' + new Date().toLocaleString()); lines.push('');
        lines.push(subBorder); lines.push('SUBJECT PERFORMANCE'); lines.push(subBorder); lines.push('');
        lines.push('    SUBJECT              TEACHER          PAPER 1    PAPER 2    TOTAL    GRADE'); lines.push('    ' + '─'.repeat(68));
        var subjects = r ? r.marks : window.getStudentSubjects(s).map(sub => ({ subject: sub, marks: 0, grade: '-', points: 0 }));
        for (var i = 0; i < subjects.length; i++) {
          var m = subjects[i]; var subj = m.subject.length > 20 ? m.subject.substring(0,17) + '...' : pad(m.subject, 20);
          var teacher = 'Mr./Ms. ___', p1 = m.paper1 != null ? pad(m.paper1, 5) + '/50' : '   -  ', p2 = m.paper2 != null ? pad(m.paper2, 5) + '/50' : '   -  ';
          var total = m.marks != null ? pad(m.marks, 5) + '/100' : '   -  ', grade = m.grade || '-';
          lines.push('    ' + subj + '  ' + pad(teacher, 15) + '  ' + p1 + '    ' + p2 + '    ' + total + '     ' + grade);
        } lines.push(''); lines.push(subBorder); lines.push('SUMMARY'); lines.push(subBorder);
        var totalMarks = r ? r.totalMarks || 0 : 0, maxMarks = subjects.length * 100;
        var percentage = maxMarks > 0 ? ((totalMarks / maxMarks) * 100).toFixed(1) : '0.0';
        var overallGrade = window.getUCEPoints(parseFloat(percentage)).grade, division = '';
        if (percentage >= 75) division = 'I'; else if (percentage >= 65) division = 'II'; else if (percentage >= 50) division = 'III'; else if (percentage >= 40) division = 'IV'; else division = 'U';
        lines.push('Total Marks Obtained:              ' + totalMarks); lines.push('Total Marks Possible:              ' + maxMarks);
        lines.push('Percentage:                        ' + percentage + '%'); lines.push('Overall Grade:                     ' + overallGrade);
        lines.push('Division:                          ' + division); lines.push('Position in Class:                 ' + (r && r.position ? r.position + ' / ' + (r.classSize || 'N/A') : 'N/A')); lines.push('');
        lines.push(subBorder); lines.push('TEACHER COMMENTS'); lines.push(subBorder);
        for (var i = 0; i < subjects.length; i++) { var m = subjects[i]; lines.push(m.subject + ':  Good effort, keep improving!'); } lines.push('');
        lines.push(subBorder); lines.push('CLASS TEACHER:        Mr./Ms. _______________'); lines.push('CLASS TEACHER SIGN:   ___________________'); lines.push('');
        lines.push('PRINCIPAL:            Mr./Ms. _______________'); lines.push('PRINCIPAL SIGN:       ___________________'); lines.push('');
        lines.push('SCHOOL STAMP:         [                    ]'); lines.push(''); lines.push(border);
        lines.push(center('This is a computer-generated report.', 75)); lines.push(center('No signature required if printed digitally.', 75)); lines.push(border);
        return lines.join('\n');
      };

      // =========================================
      // STORAGE & BACKEND SYNC
      // =========================================
      function safeSave() {
        try {
          localStorage.setItem('sh_st', JSON.stringify(students));          localStorage.setItem('sh_tch', JSON.stringify(teachers));
          localStorage.setItem('sh_ct', JSON.stringify(classTeachers));
          localStorage.setItem('sh_an', JSON.stringify(announcements));
          localStorage.setItem('sh_id', nextStudentId);
          localStorage.setItem('sh_tid', nextTeacherId);
          localStorage.setItem('sh_ctid', nextCTId);
          localStorage.setItem('sh_pd', JSON.stringify(currentPeriod));
          localStorage.setItem('sh_cc', JSON.stringify(customCombos));
        } catch (e) { showToast("⚠️ Storage full/restricted", "error"); }
      }

      function safeLoad() {
        try {
          var a = localStorage.getItem('sh_st'), b = localStorage.getItem('sh_an'),
              c = localStorage.getItem('sh_id'), d = localStorage.getItem('sh_pd'),
              e = localStorage.getItem('sh_cc'), f = localStorage.getItem('sh_tch'),
              g = localStorage.getItem('sh_ct'), h = localStorage.getItem('sh_tid'),
              i = localStorage.getItem('sh_ctid');
          if (a) students = JSON.parse(a);
          if (b) announcements = JSON.parse(b);
          if (c) nextStudentId = parseInt(c);
          if (d) currentPeriod = JSON.parse(d);
          if (e) customCombos = JSON.parse(e);
          if (f) teachers = JSON.parse(f); else teachers = [];
          if (g) classTeachers = JSON.parse(g); else classTeachers = [];
          if (h) nextTeacherId = parseInt(h);
          if (i) nextCTId = parseInt(i);
          if (!students || !students.length) students = [];
          if (!announcements || !announcements.length) announcements = [];
          for (var i = 0; i < students.length; i++) {
            var s = students[i];
            if (!s.results) s.results = [];
            if (!s.reports) s.reports = [];
            if (!s.alerts) s.alerts = [];
            if (!s.joinDate) s.joinDate = new Date().toISOString().slice(0, 10);
            if (!s.image) s.image = "";
            if (!s.subjects) s.subjects = [];
            if (!s.subsidiaries) s.subsidiaries = [];
            if (!s.combination) s.combination = "";

        document.getElementById('app').innerHTML = '<div class="card" id="stCard"><div class="flex-between"><h2>🎓 Dashboard</h2><button onclick="window.logout()" class="btn-danger" type="button">🚪 Sign Out</button></div><div class="profile-card"><div class="flex">' + (s.image ? '<img src="' + s.image + '" style="width:60px;height:60px">' : '<div style="width:60px;height:60px;background:#e5e7eb;border-radius:50%;display:flex;align-items:center;justify-content:center">👤</div>') + '<div><strong>🆔 #' + s.id + '</strong><br>👤 ' + window.escapeHtml(s.name) + '<br>📞 ' + window.escapeHtml(s.phone) + ' | 📚 ' + s.class + '<br>📅 Joined: ' + s.joinDate + '<br>' + (s.combination ? '🔹 Combo: ' + s.combination : '') + '</div></div></div><div class="flex-between"><h3>🚨 Alerts</h3></div><div id="alL"></div><div class="flex-between"><h3>📊 Results</h3><button onclick="window.showGraph(' + s.id + ')" class="btn-warning" style="margin:0" type="button">📈 Graph</button></div><div id="rsL"></div><div class="flex-between"><h3>📄 Reports</h3><button onclick="window.generateReport(' + s.id + ')" class="btn-success" style="margin:0" type="button">📥 Download Report</button></div><div id="rpL"></div><div><h3>📢 Announcements</h3><div id="anL"></div></div></div>';
        addBadge('stCard');
        document.getElementById('alL').innerHTML = (s.alerts || []).map(x => '<div class="alert-card"><strong>⚠️ ' + window.escapeHtml(x.m) + '</strong><br><small>📅 ' + x.d + '</small></div>').join('') || '<div class="profile-card">✅ None</div>';
        var isAL = (s.class === 'Senior 5' || s.class === 'Senior 6');
        document.getElementById('rsL').innerHTML = !(s.results || []).length ? '<div class="profile-card">📭 None</div>' : s.results.slice().reverse().map(r => {
          var cl = isAL ? (r.points >= 3 ? 'pts-' + (7 - r.points) : 'pts-6') : 'pts-' + r.points;
          return '<div class="result-card"><div class="flex-between"><b>' + r.phase + ' • T' + r.term + '</b><span class="badge ' + cl + '">' + r.points + 'pts</span></div><p>Avg: ' + r.average + '% | Pos: ' + (r.position || 'N/A') + '</p><table class="marks-table"><tr><th>Subject</th><th>Marks</th><th>Grade</th><th>Pts</th></tr>' + r.marks.map(m => { var g = window.getSubjectPoints(m.subject, m.marks); return '<tr><td>' + m.subject + '</td><td>' + m.marks + '</td><td><span class="badge ' + g.class + '">' + g.grade + '</span></td><td>' + g.pts + '</td></tr>'; }).join('') + '</table></div>';
        }).join('');
        document.getElementById('rpL').innerHTML = !(s.reports || []).length ? '<div class="profile-card">📂 None</div>' : s.reports.map(r => '<div class="report-card"><b>📄 ' + window.escapeHtml(r.fn) + '</b><br><small>' + r.d + '</small><br><button onclick="window.dlRMy(' + r.id + ')" class="btn-primary" style="margin-top:6px" type="button">⬇ Download</button></div>').join('');
        document.getElementById('anL').innerHTML = announcements.filter(a => a.target === 'all' || a.target === s.class).map(a => '<div class="announce-card"><strong>📢 ' + window.escapeHtml(a.title) + '</strong><br><small>📅 ' + a.d + '</small><p style="margin-top:4px">' + window.escapeHtml(a.body) + '</p></div>').join('') || '<div class="profile-card">📭 None</div>';
      }      window.dlRMy = function(id) { var r = currentUser.data.reports.find(x => x.id == id); if (r) { var a = document.createElement('a'); a.href = r.fd; a.download = r.fn; try { a.click(); } catch (e) { showToast('Download blocked', 'error'); } } };

      // =========================================
      // INIT
      // =========================================
      safeLoad(); showLogin();
    })();
  </script>
</body>
